id: beishi.g2.add_subtract.problem_reading
title: 100以内加减法应用题：先读懂问题再计算
grade: 2
strand: number_and_operations
prerequisites: []
tags:
  - beishi2024
  - grade2
  - add_subtract
  - word_problem
  - problem_reading
summary: >
  训练学生识别问题目标、已知条件和数量变化，再决定使用加法还是减法。
  本单元题目为自编练习，不是教材原题。
mini_lesson:
  steps:
    - 先读题目最后一句，弄清楚题目究竟要求求什么。
    - 找出已知数量，以及“又得到、送出、借出、还剩”等表示变化的词。
    - 用自己的话说一遍数量发生了什么变化。
    - 列算式前，先判断答案应该比原来的数量大还是小。
    - 算完后检查答案是否回答了题目真正的问题。
  worked_example:
    problem: 小禾原来有28张贴纸，送给同学6张，后来又得到4张。小禾现在有多少张贴纸？
    steps:
      - 题目问现在有多少张，要计算最后剩下的数量。
      - 送出6张，数量减少；后来得到4张，数量增加。
      - 先算28 - 6 = 22，再算22 + 4 = 26。
      - 检查：26比原来的28少2张，符合送出6张、又得到4张的变化。
practice:
  - id: p01_basic
    problem: 小林有35颗弹珠，送给弟弟8颗。小林还剩多少颗弹珠？
    answer: "27"
    difficulty: 1
    common_errors:
      add_instead_of_subtract: "43"
    answer_type: text
  - id: p02_rephrase
    problem: 书架上原来有42本书，借出一些后还剩30本。借出了多少本书？
    answer: "12"
    difficulty: 2
    common_errors:
      report_remaining_instead_of_borrowed: "30"
      add_instead_of_subtract: "72"
    answer_type: text
  - id: p03_irrelevant_detail
    problem: 班里有26个同学，今天有3位同学请假。老师还带来5盒彩笔，每盒4支。今天到校的同学有多少人？
    answer: "23"
    difficulty: 2
    common_errors:
      ignore_absence: "26"
      use_irrelevant_information: "20"
    answer_type: text
  - id: p04_reverse_question
    problem: 小雨送给朋友7张卡片后还剩15张。小雨原来有多少张卡片？
    answer: "22"
    difficulty: 2
    common_errors:
      report_remaining_instead_of_original: "15"
      subtract_instead_of_add: "8"
    answer_type: text
  - id: p05_two_step
    problem: 公园里原来有24只白鸽和17只灰鸽，后来飞走了9只白鸽。现在公园里一共有多少只鸽子？
    answer: "32"
    difficulty: 3
    common_errors:
      forget_flew_away: "41"
    answer_type: text
common_misconceptions:
  - id: add_instead_of_subtract
    description: 把送出、借出等表示数量减少的情境误判为增加。
    hint_l1: 先不列算式。故事发生后，题目中的数量变多了还是变少了？
    hint_l2: 送出去的东西不再属于原来的数量，通常需要从原数中减去。
  - id: report_remaining_instead_of_borrowed
    description: 把题目已知的剩余数量直接当成要求的数量。
    hint_l1: 圈出题目最后问的词。它问的是“还剩多少”，还是“借出了多少”？
    hint_l2: 已知原来有多少和现在还剩多少，要找减少的数量，可以用原数减去剩余数。
  - id: ignore_absence
    description: 忽略请假、离开等改变当前人数的条件。
    hint_l1: 题目问的是全班有多少人，还是今天到校有多少人？
    hint_l2: 把请假的人数从全班人数中减去。
  - id: use_irrelevant_information
    description: 把题目中出现的所有数字都拿来计算。
    hint_l1: 逐个检查数字：它和“今天到校的同学人数”有关系吗？
    hint_l2: 彩笔数量与到校人数无关，这道题不需要使用彩笔的信息。
  - id: report_remaining_instead_of_original
    description: 题目要求原来有多少，却直接报告剩余数量。
    hint_l1: 题目问的是“原来有多少”，还是“现在还剩多少”？
    hint_l2: 原来的数量 = 送出或用掉的数量 + 剩下的数量。
  - id: subtract_instead_of_add
    description: 已知减少的数量和剩余数量，却再次相减。
    hint_l1: 如果后来又把送出去的卡片加回来，原来的数量会比剩下的多还是少？
    hint_l2: 原来有的数量包括送出的7张和剩下的15张，可以把这两个数量相加。
