services:
  backend:
    build:
      context: ../..
      dockerfile: apps/math-tutor/Dockerfile
      target: backend
    environment:
      MATH_TUTOR_DB_PATH: /data/math_tutor.sqlite3
    volumes:
      - math-tutor-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  frontend:
    build:
      context: ../..
      dockerfile: apps/math-tutor/Dockerfile
      target: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MATH_TUTOR_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - internal

volumes:
  math-tutor-data:

networks:
  internal:
    driver: bridge
