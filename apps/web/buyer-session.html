<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>买家视角采集</title><style>body{font-family:system-ui;padding:32px;max-width:760px;margin:auto}button,input,select{padding:10px;margin:6px 0}#log{white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:8px}</style></head><body><h1>买家视角采集</h1><p>选择平台后打开独立浏览会话。登录由你本人完成，系统只读取正常可见页面。</p><select id="platform"><option value="TAOBAO">淘宝</option><option value="PINDUODUO">拼多多</option></select><br><button onclick="start()">打开平台会话</button><div id="step"></div><input id="query" placeholder="登录后输入关键词" disabled><button id="search" onclick="search()" disabled>开始搜索</button><pre id="log">等待启动。</pre><script>
let started=false;
function log(x){document.getElementById('log').textContent=x}
function start(){started=true;document.getElementById('query').disabled=false;document.getElementById('search').disabled=false;document.getElementById('step').textContent='请在浏览器会话中完成登录，然后返回这里输入关键词。';log('会话已初始化。真实浏览器连接需要后端浏览器运行时。')}
function search(){if(!started)return;const q=document.getElementById('query').value.trim();if(!q)return;log('已接收关键词：'+q+'\n下一阶段：由浏览器会话执行平台搜索并提取买家可见结果。')}
</script></body></html>
