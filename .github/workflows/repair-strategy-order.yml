name: repair strategy center script order
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair script order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("apps/web/index.html")
          s=p.read_text()
          s=s.replace('<script src="./strategy-center-fix.js?v=20260929-59"></script>','<script src="./strategy-center-fix.js?v=20260929-60" defer></script>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/index.html
          git diff --cached --quiet || (git commit -m "fix: load simulation controller after app" && git push)
