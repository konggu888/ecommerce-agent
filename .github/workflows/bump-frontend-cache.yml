name: bump frontend cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump frontend cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("apps/web/index.html")
          s=p.read_text()
          s=s.replace('app-db.js?v=20260929-53','app-db.js?v=20260929-61')
          s=s.replace('strategy-center-fix.js?v=20260929-60','strategy-center-fix.js?v=20260929-61')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/index.html
          git diff --cached --quiet || (git commit -m "fix: bust strategy center frontend cache" && git push)
