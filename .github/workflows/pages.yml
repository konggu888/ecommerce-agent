name: Deploy web dashboard to GitHub Pages
# force-pages-redeploy-20260930-1

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployed source
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Index markers:"
          grep -n "BOOT-DEBUG\|DATABASE-DEBUG" apps/web/index.html || true
          echo "app-db.js size:"
          wc -c apps/web/app-db.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
