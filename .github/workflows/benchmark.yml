name: ecommerce-agent-benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/ecommerce-mcp/src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'README.md'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
