name: Taobao sandbox connectivity

on:
  push:
    paths:
      - 'packages/ecommerce-mcp/src/taobao-sandbox-client.mjs'
      - '.github/workflows/taobao-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-connectivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Call official Taobao sandbox
        run: node packages/ecommerce-mcp/src/taobao-sandbox-client.mjs
