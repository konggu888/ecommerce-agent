name: Taobao sandbox full real-data test

on:
  push:
    paths:
      - 'packages/ecommerce-mcp/src/taobao-sandbox-client.mjs'
      - '.github/workflows/taobao-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-full-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run repository tests
        run: npm test

      - name: Run real Taobao sandbox suite
        run: node packages/ecommerce-mcp/src/taobao-sandbox-client.mjs
