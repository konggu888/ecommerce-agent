name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build math-tutor Vue frontend
        run: npm run --workspace @math-tutor/frontend build

      - name: Test math-tutor frontend helpers
        run: npm run --workspace @math-tutor/frontend test

      - name: Setup Python for math-tutor baseline
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install math-tutor baseline dependencies
        run: python -m pip install -r apps/math-tutor/requirements-dev.txt

      - name: Install Chromium for math-tutor mobile E2E
        run: npm exec --workspace @math-tutor/frontend -- playwright install --with-deps chromium

      - name: Run math-tutor mobile browser E2E with live FastAPI
        run: npm run --workspace @math-tutor/frontend test:e2e

      - name: Run math-tutor environment baseline tests
        run: python -m pytest -q apps/math-tutor/tests

      - name: Verify math-tutor progress snapshot is current
        run: python apps/math-tutor/scripts/update_progress.py --check

      - name: Build self-hosted math-tutor Docker images
        run: |
          docker build -f apps/math-tutor/Dockerfile --target backend -t math-tutor-backend:ci .
          docker build -f apps/math-tutor/Dockerfile --target frontend -t math-tutor-frontend:ci .

      - name: Frontend syntax check
        run: |
          node --check apps/web/game-logic-library.js
          node --check apps/web/threat-library.js
          node --check apps/web/threat-playbooks.js
          node --check apps/web/positive-attack-library.js
          node --check apps/web/positive-attack-playbooks.js
          node --check apps/web/human-behavior-library.js
          node --check apps/web/app-db.js

      - name: Desktop Python syntax check
        run: |
          python3 -m py_compile apps/ad-studio-desktop/run.py
          python3 -m compileall -q apps/ad-studio-desktop/ad_studio

      - name: Desktop core tests
        run: python3 -m unittest discover -s apps/ad-studio-desktop -p 'test_*.py'

      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests
        run: npm run test:engine

      - name: Risk controller tests
        run: node --test tests/risk-controller.test.js
