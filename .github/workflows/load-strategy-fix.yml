name: load strategy center fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure strategy fix script is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("apps/web/index.html")
          s=p.read_text()
          tag='<script src="./strategy-center-fix.js?v=20260929-59"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/index.html
          git diff --cached --quiet || (git commit -m "fix: load strategy center controller" && git push)
