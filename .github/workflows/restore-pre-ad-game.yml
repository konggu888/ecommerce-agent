name: Restore pre-ad-bidding state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !startsWith(github.event.head_commit.message, 'restore: pre-ad-bidding state') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore files from known-good parent commit
        run: |
          git fetch origin b9f474de275b6eb13ab44682e8a231c58d408d2e
          git checkout b9f474de275b6eb13ab44682e8a231c58d408d2e -- apps/web/app-db.js apps/web/index.html apps/web/ad-bidding-game.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app-db.js apps/web/index.html apps/web/ad-bidding-game.js
          git commit -m "restore: pre-ad-bidding state"
          git push origin HEAD:main
